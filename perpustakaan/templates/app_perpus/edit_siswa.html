
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIPUSTAKA - Edit User</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-[#f4f6fa] min-h-screen flex">

    <div class="w-64 bg-[#090e1a] text-white flex flex-col justify-between p-6 shrink-0">
        <div>
            <div class="flex items-start gap-3 mb-10">
                <div class="w-10 h-10 bg-[#3b82f6] rounded-xl flex items-center justify-center font-bold text-lg shadow-lg">P</div>
                <div>
                    <span class="text-xs font-semibold text-gray-500 block uppercase">Sipustaka</span>
                    <h1 class="text-sm font-bold text-gray-200">Sistem Peminjaman Buku</h1>
                </div>
            </div>

            <nav class="space-y-2">
                <a href="{% url 'dashboard' %}" class="flex items-center gap-3 px-4 py-3 text-sm font-medium text-gray-400 hover:text-white rounded-xl transition">
                    <i class="fa-solid fa-table-cells-large w-5"></i> Dashboard
                </a>
                <a href="{% url 'list_buku' %}" class="flex items-center gap-3 px-4 py-3 text-sm font-medium text-gray-400 hover:text-white rounded-xl transition">
                    <i class="fa-solid fa-book w-5"></i> Buku
                </a>
                <a href="{% url 'list_peminjaman' %}" class="flex items-center gap-3 px-4 py-3 text-sm font-medium text-gray-400 hover:text-white rounded-xl transition">
                    <i class="fa-solid fa-receipt w-5"></i> Peminjaman
                </a>
                <a href="{% url 'list_siswa' %}" class="flex items-center gap-3 px-4 py-3 text-sm font-medium text-white bg-white/10 rounded-xl transition">
                    <i class="fa-solid fa-users w-5"></i> Daftar User
                </a>
            </nav>
        </div>
        
        <div class="bg-white/5 rounded-2xl p-4 border border-white/5">
            <span class="text-[10px] uppercase font-bold text-gray-500 block mb-1">Admin Aktif</span>
            <span class="text-sm font-semibold text-gray-200 block">Budi Siregar</span>
        </div>
    </div>

    <div class="flex-1 p-10 flex flex-col">
        
        <div class="flex items-center gap-4 mb-8">
            <a href="{% url 'list_siswa' %}" class="text-gray-400 hover:text-gray-600 transition">
                <i class="fa-solid fa-arrow-left text-lg"></i>
            </a>
            <div>
                <span class="text-xs font-semibold text-gray-400 block tracking-wide">Kelola User</span>
                <h2 class="text-2xl font-bold text-gray-800">Edit User</h2>
            </div>
        </div>

        <div class="bg-white rounded-3xl p-8 shadow-sm border border-gray-100 max-w-4xl">
            <form method="POST" class="space-y-6">
                {% csrf_token %}
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-2">
                        <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide">Nama</label>
                        <input type="text" name="nama" value="{{ siswa.nama }}" required
                               class="w-full px-4 py-3 bg-gray-50/50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-blue-500 focus:bg-white transition duration-200">
                    </div>
                    <div class="space-y-2">
                        <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide">Kelas</label>
                        <input type="text" name="kelas" value="{{ siswa.kelas }}" required
                               class="w-full px-4 py-3 bg-gray-50/50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-blue-500 focus:bg-white transition duration-200">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-2">
                        <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide">NIS</label>
                        <input type="number" name="nis" value="{{ siswa.nis }}" required
                               class="w-full px-4 py-3 bg-gray-50/50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-blue-500 focus:bg-white transition duration-200">
                    </div>
                    <div class="space-y-2">
                        <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide">Status</label>
                        <div class="relative">
                            <select name="status" class="w-full px-4 py-3 bg-gray-50/50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-blue-500 focus:bg-white appearance-none transition duration-200">
                                <option value="Aktif" {% if siswa.status == 'Aktif' %}selected{% endif %}>Aktif</option>
                                <option value="Nonaktif" {% if siswa.status == 'Nonaktif' %}selected{% endif %}>Nonaktif</option>
                            </select>
                            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-400">
                                <i class="fa-solid fa-chevron-down text-xs"></i>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="flex items-center justify-end space-x-3 pt-6 border-t border-gray-50">
                    <a href="{% url 'list_siswa' %}" class="px-5 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-600 rounded-xl text-xs font-semibold transition duration-200">
                        Batal
                    </a>
                    <button type="submit" class="px-5 py-2.5 bg-[#2563eb] hover:bg-blue-700 text-white rounded-xl text-xs font-bold shadow-md transition duration-200">
                        Perbarui User
                    </button>
                </div>
            </form>
        </div>
    </div>

</body>

</html>
