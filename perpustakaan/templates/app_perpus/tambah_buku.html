<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIPUSTAKA - Tambah Buku</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght=400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-[#f4f7fe]">

    <div class="flex h-screen overflow-hidden">
        
        <div class="w-64 bg-[#0b132b] text-white flex flex-col justify-between p-4 flex-shrink-0">
            <div>
                <div class="p-2 mt-2">
                    <p class="text-[10px] uppercase tracking-widest text-gray-400 font-semibold">Sipustaka</p>
                    <div class="flex items-center space-x-3 mt-1">
                        <div class="w-10 h-10 rounded-full bg-blue-500 flex items-center justify-center font-bold text-lg shadow-md">
                            P
                        </div>
                        <span class="text-sm font-bold leading-tight block">Sistem Peminjaman<br>Buku</span>
                    </div>
                </div>

                <hr class="border-gray-700 my-5 opacity-50">

                <nav class="space-y-1">
                    <a href="{% url 'dashboard' %}" class="flex items-center space-x-3 p-3 text-gray-400 hover:bg-[#1c2541] hover:text-white rounded-xl transition text-sm font-medium">
                        <i class="fa-solid fa-table-columns text-base"></i>
                        <span>Dashboard</span>
                    </a>
                    <a href="{% url 'list_buku' %}" class="flex items-center space-x-3 p-3 bg-[#1c2541] rounded-xl text-white font-medium transition text-sm">
                        <i class="fa-solid fa-book-open opacity-80 text-base"></i>
                        <span>Buku</span>
                    </a>
                    <a href="{% url 'list_peminjaman' %}" class="flex items-center space-x-3 p-3 text-gray-400 hover:bg-[#1c2541] hover:text-white rounded-xl transition text-sm font-medium">
                        <i class="fa-solid fa-rectangle-list text-base"></i>
                        <span>Peminjaman</span>
                    </a>
                    <a href="{% url 'list_siswa' %}" class="flex items-center space-x-3 p-3 text-gray-400 hover:bg-[#1c2541] hover:text-white rounded-xl transition text-sm font-medium">
                        <i class="fa-solid fa-user-gear text-base"></i>
                        <span>User</span>
                    </a>
                </nav>
            </div>

            <div class="bg-[#1c2541] p-3 rounded-xl flex flex-col mb-2">
                <span class="text-[11px] text-gray-400">Admin Aktif</span>
                <span class="text-sm font-semibold mt-0.5 text-white">Budi Siregar</span>
            </div>
        </div>

        <div class="flex-1 flex flex-col overflow-y-auto p-8">
            
            <div class="mb-2">
                <a href="{% url 'list_buku' %}" class="text-gray-400 hover:text-gray-600 transition flex items-center space-x-2 text-xs font-medium">
                    <i class="fa-solid fa-arrow-left text-xs"></i>
                    <span>Kelola Buku</span>
                </a>
            </div>

            <div class="mb-6">
                <h1 class="text-xl font-bold text-gray-800">Tambah Buku</h1>
            </div>

            <form method="POST" class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 max-w-4xl space-y-4">
                {% csrf_token %}
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Judul Buku</label>
                        <input type="text" name="judul" placeholder="Masukkan judul buku" required
                            class="w-full bg-[#f8fafc] border border-gray-100 rounded-xl px-4 py-2.5 text-xs font-medium text-gray-800 focus:outline-none focus:border-blue-500 transition">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Pengarang</label>
                        <input type="text" name="pengarang" placeholder="Masukkan nama pengarang" required
                            class="w-full bg-[#f8fafc] border border-gray-100 rounded-xl px-4 py-2.5 text-xs font-medium text-gray-800 focus:outline-none focus:border-blue-500 transition">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Kategori</label>
                        <select name="kategori" class="w-full bg-[#f8fafc] border border-gray-100 rounded-xl px-4 py-2.5 text-xs font-medium text-gray-600 focus:outline-none focus:border-blue-500 transition">
                            <option value="Novel">Novel</option>
                            <option value="Edukasi">Edukasi</option>
                            <option value="Sains">Sains</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Penerbit</label>
                        <input type="text" name="penerbit" placeholder="Masukkan nama penerbit" required
                            class="w-full bg-[#f8fafc] border border-gray-100 rounded-xl px-4 py-2.5 text-xs font-medium text-gray-800 focus:outline-none focus:border-blue-500 transition">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Tahun Terbit</label>
                        <input type="number" name="tahun" placeholder="Contoh: 2024" required
                            class="w-full bg-[#f8fafc] border border-gray-100 rounded-xl px-4 py-2.5 text-xs font-medium text-gray-800 focus:outline-none focus:border-blue-500 transition">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Stok</label>
                        <input type="number" name="stok" placeholder="Jumlah stok buku" required
                            class="w-full bg-[#f8fafc] border border-gray-100 rounded-xl px-4 py-2.5 text-xs font-medium text-gray-800 focus:outline-none focus:border-blue-500 transition">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">ISBN</label>
                        <input type="text" name="isbn" placeholder="Masukkan nomor ISBN (Opsional)"
                            class="w-full bg-[#f8fafc] border border-gray-100 rounded-xl px-4 py-2.5 text-xs font-medium text-gray-800 focus:outline-none focus:border-blue-500 transition">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Rak / Lokasi</label>
                        <input type="text" name="rak" placeholder="Contoh: Rak A-04" required
                            class="w-full bg-[#f8fafc] border border-gray-100 rounded-xl px-4 py-2.5 text-xs font-medium text-gray-800 focus:outline-none focus:border-blue-500 transition">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Deskripsi</label>
                    <textarea name="deskripsi" rows="3" placeholder="Tuliskan deskripsi singkat atau sinopsis buku..."
                        class="w-full bg-[#f8fafc] border border-gray-100 rounded-xl px-4 py-2.5 text-xs font-medium text-gray-800 focus:outline-none focus:border-blue-500 transition"></textarea>
                </div>

                <div class="flex justify-end space-x-2 pt-4 border-t border-gray-100">
                    <a href="{% url 'list_buku' %}" class="px-5 py-2 rounded-xl border border-gray-200 text-xs font-semibold text-gray-500 hover:bg-gray-50 transition">
                        Batal
                    </a>
                    <button type="submit" class="px-5 py-2 rounded-xl bg-blue-600 text-xs font-semibold text-white hover:bg-blue-700 shadow-sm transition">
                        Simpan Buku
                    </button>
                </div>
            </form>

        </div>
    </div>

</body>
</html>
