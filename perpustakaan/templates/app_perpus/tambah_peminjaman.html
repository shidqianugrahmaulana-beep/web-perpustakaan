<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIPUSTAKA - Tambah Peminjaman</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght=400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-[#f4f7fe]">

    <div class="flex h-screen overflow-hidden">
        
        <div class="w-64 bg-[#0b132b] text-white flex flex-col justify-between p-4 flex-shrink-0">
            <div>
                <div class="p-2 mt-2">
                    <p class="text-[10px] uppercase tracking-widest text-gray-400 font-semibold">Sipustaka</p>
                    <div class="flex items-center space-x-3 mt-1">
                        <div class="w-10 h-10 rounded-full bg-blue-500 flex items-center justify-center font-bold text-lg shadow-md">P</div>
                        <span class="text-sm font-bold leading-tight block">Sistem Peminjaman<br>Buku</span>
                    </div>
                </div>
                <hr class="border-gray-700 my-5 opacity-50">
                <nav class="space-y-1">
                    <a href="#" class="flex items-center space-x-3 p-3 text-gray-400 hover:bg-[#1c2541] hover:text-white rounded-xl transition text-sm font-medium">
                        <i class="fa-solid fa-table-columns text-base"></i><span>Dashboard</span>
                    </a>
                    <a href="#" class="flex items-center space-x-3 p-3 text-gray-400 hover:bg-[#1c2541] hover:text-white rounded-xl transition text-sm font-medium">
                        <i class="fa-solid fa-book-open text-base"></i><span>Buku</span>
                    </a>
                    <a href="{% url 'list_peminjaman' %}" class="flex items-center space-x-3 p-3 bg-[#1c2541] rounded-xl text-white font-medium transition text-sm">
                        <i class="fa-solid fa-rectangle-list opacity-80 text-base"></i><span>Peminjaman</span>
                    </a>
                    <a href="#" class="flex items-center space-x-3 p-3 text-gray-400 hover:bg-[#1c2541] hover:text-white rounded-xl transition text-sm font-medium">
                        <i class="fa-solid fa-user-gear text-base"></i><span>User</span>
                    </a>
                </nav>
            </div>
            <div class="bg-[#1c2541] p-3 rounded-xl flex flex-col mb-2">
                <span class="text-[11px] text-gray-400">Admin Aktif</span>
                <span class="text-sm font-semibold mt-0.5 text-white">Budi Siregar</span>
            </div>
        </div>

        <div class="flex-1 flex flex-col overflow-y-auto p-8">
            <div class="mb-4">
                <a href="{% url 'list_peminjaman' %}" class="text-gray-400 hover:text-gray-600 flex items-center space-x-2 text-xs font-semibold transition">
                    <i class="fa-solid fa-arrow-left"></i><span>Kembali ke Daftar</span>
                </a>
            </div>

            <div class="mb-6">
                <p class="text-xs text-gray-400 font-medium">Formulir Baru</p>
                <h1 class="text-2xl font-bold text-gray-800">Pinjam Buku</h1>
            </div>

            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 max-w-3xl">
                <form method="POST" action="{% url 'tambah_peminjaman' %}" class="space-y-5">
                    {% csrf_token %} <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Nama Peminjam</label>
                        <input type="text" name="nama_siswa" placeholder="Masukkan nama lengkap siswa..." required
                            class="w-full bg-[#f8fafc] border border-gray-200 rounded-xl px-4 py-3 text-xs font-medium text-gray-800 focus:outline-none focus:border-blue-500 focus:bg-white transition">
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Buku Yang Dipinjam</label>
                        <input type="text" name="judul_buku" placeholder="Masukkan judul buku perpustakaan..." required
                            class="w-full bg-[#f8fafc] border border-gray-200 rounded-xl px-4 py-3 text-xs font-medium text-gray-800 focus:outline-none focus:border-blue-500 focus:bg-white transition">
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Tanggal Pinjam</label>
                            <input type="text" name="tanggal_pinjam" placeholder="Contoh: 13 Jun 2026" required
                                class="w-full bg-[#f8fafc] border border-gray-200 rounded-xl px-4 py-3 text-xs font-medium text-gray-800 focus:outline-none focus:border-blue-500 focus:bg-white transition">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Tanggal Kembali</label>
                            <input type="text" name="tanggal_kali" placeholder="Contoh: 20 Jun 2026" required
                                class="w-full bg-[#f8fafc] border border-gray-200 rounded-xl px-4 py-3 text-xs font-medium text-gray-800 focus:outline-none focus:border-blue-500 focus:bg-white transition">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Keperluan</label>
                        <textarea name="keperluan" rows="3" placeholder="Contoh: Tugas sekolah Referensi tugas Bahasa Indonesia..." required
                            class="w-full bg-[#f8fafc] border border-gray-200 rounded-xl px-4 py-3 text-xs font-medium text-gray-800 focus:outline-none focus:border-blue-500 focus:bg-white transition resize-none"></textarea>
                    </div>

                    <div class="flex justify-end space-x-3 pt-4 border-t border-gray-50">
                        <a href="{% url 'list_peminjaman' %}" class="px-5 py-2.5 rounded-xl border border-gray-200 text-xs font-semibold text-gray-500 hover:bg-gray-50 transition">
                            Batal
                        </a>
                        <button type="submit" class="px-6 py-2.5 rounded-xl bg-blue-600 text-xs font-bold text-white hover:bg-blue-700 shadow-sm transition flex items-center space-x-2">
                            <i class="fa-solid fa-floppy-disk"></i>
                            <span>Simpan Peminjaman</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>

    </div>

</body>
</html>
